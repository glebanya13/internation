# Админка и API. Бот работает через long polling и наружу не смотрит.
#
# HTTPS: после получения сертификата Let's Encrypt замените конфиг на
# deploy/nginx-https.conf.example (см. DEPLOY.md).
#
# resolver + переменная в proxy_pass: Docker пересоздаёт api с новым IP,
# а статический upstream кэширует старый адрес → 502 Bad Gateway.

server {
    listen 80;
    server_name _;

    # Встроенный DNS Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20m;

    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml;

    location / {
        set $api_upstream api:3000;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
