# Развёртывание на VPS. Firebase не используется.
#
#   Internet → Nginx ─┬─ Admin Web
#                     └─ Backend API ─┬─ PostgreSQL
#                                     ├─ Telegram Bot
#                                     ├─ Worker/Scheduler
#                                     └─ Chromium (в образе, только для PDF)

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-dorm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dorm_duty}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  SESSION_SECRET: ${SESSION_SECRET:?требуется SESSION_SECRET}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
  PG_POOL_MAX: ${PG_POOL_MAX:-3}
  SCHEDULER_INTERVAL_MINUTES: ${SCHEDULER_INTERVAL_MINUTES:-5}
  SECURE_COOKIES: ${SECURE_COOKIES:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dorm_duty}
      POSTGRES_USER: ${POSTGRES_USER:-dorm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?требуется POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dorm} -d ${POSTGRES_DB:-dorm_duty}']
      interval: 10s
      timeout: 5s
      retries: 5
    # PostgreSQL доступен только внутри docker network — порты наружу не публикуем.

  migrate:
    build: .
    command: npx tsx src/db/migrate.ts up
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-dorm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dorm_duty}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    command: npx tsx src/main/api.ts
    environment:
      <<: *app-env
      PORT: 3000
    # Chromium для PDF нужен shared memory больше 64 MB по умолчанию.
    shm_size: '256mb'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bot:
    build: .
    command: npx tsx src/main/bot.ts
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: npx tsx src/main/worker.ts
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
